async function sbAuth(path, body) {
  const res = await fetch(`${SUPABASE_URL}/auth/v1/${path}`, {
    method: "POST",
    headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error_description || data.msg || data.message || "Erreur d'authentification");
  return data;
}

async function sbRest(path, { method = "GET", token, body } = {}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    method,
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${token}`,
      "Content-Type": "application/json",
      Prefer: "return=representation",
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ([]));
  if (!res.ok) throw new Error(data.message || data.hint || "Erreur base de données");
  return data;
}

function statusColor(status) {
  if (status === "Nouvelle") return C.blue;
  if (status === "Résolue") return C.green;
  if (status === "Clôturée") return C.gray;
  return C.amber;
}
function isOverdue(g) {
  if (g.status === "Résolue" || g.status === "Clôturée") return false;
  if (!g.deadline) return false;
  return new Date(g.deadline) < new Date();
}

      <button className={base} style={lang === "fr" ? on : off} onClick={() => setLang("fr")}>FR</button>
      <button className={base} style={lang === "en" ? on : off} onClick={() => setLang("en")}>EN</button>

}

function LoginScreen({ onAuth, lang, setLang }) {

    setError(""); setInfo("");

    if (password.length < 6) { setError(t("Le mot de passe doit contenir au moins 6 caractères.")); return; }
    setLoading(true);
    try {
      if (mode === "signup") {
        const data = await sbAuth("signup", { email, password });
        if (data.access_token) { onAuth({ token: data.access_token, user: data.user }); }
        else { setInfo(t("Compte créé. Vérifiez votre boîte mail si la confirmation est activée, sinon reconnectez-vous.")); setMode("signin"); }
      } else {
        const data = await sbAuth("token?grant_type=password", { email, password });
        onAuth({ token: data.access_token, user: data.user });
      }
    } catch (err) { setError(err.message); }
    finally { setLoading(false); }

  const open = total - resolved;
  const stats = [
    { label: t("Total plaintes"), value: total, color: C.ink, emoji: "📋" },
    { label: t("Résolues / clôturées"), value: resolved, color: C.green, emoji: "✅" },
    { label: t("En cours"), value: open, color: C.amber, emoji: "⏱" },
    { label: t("En retard"), value: overdue, color: C.red, emoji: "⚠️" },
  ];
  return (
    <div className="p-6 sm:p-8">
      <div className="mb-6 flex items-center justify-between">
        <div>
          <h2 className="text-2xl font-black tracking-tight" style={{ color: C.ink }}>{t("Tableau de bord")}</h2>
          <p className="text-sm" style={{ color: C.inkSoft }}>{t("Données en direct depuis Supabase")}</p>
        </div>
        <button onClick={() => setView("new")} className="flex items-center gap-2 rounded px-4 py-2 text-sm font-bold text-white" style={{ background: C.brass }}>➕ {t("Nouvelle plainte")}</button>

      <div className="mb-8 grid grid-cols-2 gap-4 lg:grid-cols-4">
        {stats.map(({ label, value, color, emoji }) => (
          <div key={label} className="rounded-lg border p-4" style={{ borderColor: C.paperDim, background: "#fff" }}>
            <div className="mb-3 flex items-center justify-between">
              <span className="text-xs font-semibold uppercase tracking-wide" style={{ color: C.inkSoft }}>{label}</span>
              <span>{emoji}</span>

            <span className="text-3xl font-black" style={{ color }}>{value}</span>

        ))}

      <div className="rounded-lg border" style={{ borderColor: C.paperDim, background: "#fff" }}>

          ))}

function NewGrievanceForm({ token, onCreated, setView }) {
  const [form, setForm] = useState({
    date: new Date().toISOString().slice(0,10), village: "", lat: "", lng: "",
    anonymous: false, name: "", gender: "Femme", contact: "",
    channel: CHANNELS[0], category: CATEGORIES[0], description: "", priority: "Moyen", deadline: "",
  });
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState("");
  const set = (k) => (e) => setForm(f => ({ ...f, [k]: e.target?.value ?? e }));
  const sensitive = form.category === "VBG / EAS-HS" || form.category === "Protection de l'enfant";

  const submit = async () => {
    setError("");
    if (!form.village.trim()) { setError(t("Le champ Village / Communauté est requis.")); return; }
    if (!form.description.trim()) { setError(t("Le champ Description est requis.")); return; }
    setSaving(true);
    try {
      const payload = {
        date_received: form.date, village: form.village || null, channel: form.channel,
        is_anonymous: form.anonymous,
        complainant_name: form.anonymous ? null : (form.name || null),
        complainant_gender: form.anonymous ? null : form.gender,
        complainant_contact: form.anonymous ? null : (form.contact || null),
        category: form.category, description: form.description, priority: form.priority,
        deadline: form.deadline || null,
        latitude: form.lat ? Number(form.lat) : null, longitude: form.lng ? Number(form.lng) : null,
      };
      const rows = await sbRest("grievances", { method: "POST", token, body: payload });
      onCreated(rows[0]);
      setView("dashboard");
    } catch (err) { setError(err.message); }
    finally { setSaving(false); }
  };

  return (
    <div className="p-6 sm:p-8">
      <div className="mb-6 flex items-center gap-3">
        <button onClick={() => setView("dashboard")} className="rounded p-1.5" style={{ color: C.inkSoft }}>‹</button>
        <div>
          <h2 className="text-2xl font-black tracking-tight" style={{ color: C.ink }}>{t("Nouvelle plainte")}</h2>
          <p className="text-sm" style={{ color: C.inkSoft }}>{t("Le numéro de dossier (GL-2026-…) est généré automatiquement à l'enregistrement")}</p>
        </div>
      </div>
      {sensitive && <div className="mb-5 flex items-center gap-2 rounded border px-4 py-3 text-sm font-semibold" style={{ borderColor: C.red, color: C.red, background: C.red + "0d" }}>⚠️ {t("Dossier sensible — accès restreint, confidentialité renforcée")}</div>}
      {error && <div className="mb-5 rounded border px-4 py-3 text-sm font-semibold" style={{ borderColor: C.red, color: C.red, background: C.red + "0d" }}>{error}</div>}
      <div className="space-y-8">
        <section className="rounded-lg border p-5" style={{ borderColor: C.paperDim, background: "#fff" }}>
          <h3 className="mb-4 text-sm font-bold" style={{ color: C.brass }}>{t("1. Informations générales")}</h3>
          <div className="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
            <Field label={t("Date de réception")} required><input type="date" value={form.date} onChange={set("date")} className={inputCls} style={inputStyle} /></Field>
            <Field label={t("Village / Communauté")} required><input value={form.village} onChange={set("village")} placeholder={t("Ex : Kanzenze")} className={inputCls} style={inputStyle} /></Field>
            <Field label={t("Canal de réception")}><select value={form.channel} onChange={set("channel")} className={inputCls} style={inputStyle}>{CHANNELS.map(c=><option key={c} value={c}>{t(c)}</option>)}</select></Field>
            <Field label={t("Latitude (optionnel)")}><input value={form.lat} onChange={set("lat")} placeholder="-10.71" className={inputCls} style={inputStyle} /></Field>
            <Field label={t("Longitude (optionnel)")}><input value={form.lng} onChange={set("lng")} placeholder="25.47" className={inputCls} style={inputStyle} /></Field>
          </div>
        </section>
        <section className="rounded-lg border p-5" style={{ borderColor: C.paperDim, background: "#fff" }}>
          <h3 className="mb-4 text-sm font-bold" style={{ color: C.brass }}>{t("2. Plaignant")}</h3>
          <label className="mb-4 flex items-center gap-2 text-sm" style={{ color: C.ink }}>
            <input type="checkbox" checked={form.anonymous} onChange={(e)=>set("anonymous")(e.target.checked)} /> {t("Plainte anonyme")}
          </label>
          {!form.anonymous && (
            <div className="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
              <Field label={t("Nom et prénom")}><input value={form.name} onChange={set("name")} className={inputCls} style={inputStyle} /></Field>
              <Field label={t("Sexe")}><select value={form.gender} onChange={set("gender")} className={inputCls} style={inputStyle}><option value="Femme">{t("Femme")}</option><option value="Homme">{t("Homme")}</option><option value="Autre">{t("Autre")}</option></select></Field>
              <Field label={t("Contact")}><input value={form.contact} onChange={set("contact")} placeholder="+243 …" className={inputCls} style={inputStyle} /></Field>
            </div>
          )}
        </section>
        <section className="rounded-lg border p-5" style={{ borderColor: C.paperDim, background: "#fff" }}>
          <h3 className="mb-4 text-sm font-bold" style={{ color: C.brass }}>{t("3. Détails de la plainte")}</h3>
          <div className="mb-4 grid gap-4 sm:grid-cols-2">
            <Field label={t("Catégorie")} required><select value={form.category} onChange={set("category")} className={inputCls} style={inputStyle}>{CATEGORIES.map(c=><option key={c} value={c}>{t(c)}</option>)}</select></Field>
            <Field label={t("Pièces jointes")}><div className="flex items-center gap-2 rounded border px-3 py-2 text-sm" style={{ borderColor: C.paperDim, color: C.inkSoft }}>📎 {t("Photo, audio ou document (v2)")}</div></Field>
          </div>
          <Field label={t("Description")} required><textarea rows={4} value={form.description} onChange={set("description")} placeholder={t("Décrire les faits, personnes concernées, contexte…")} className={inputCls} style={inputStyle} /></Field>
        </section>
        <section className="rounded-lg border p-5" style={{ borderColor: C.paperDim, background: "#fff" }}>
          <h3 className="mb-4 text-sm font-bold" style={{ color: C.brass }}>{t("4. Classification & traitement")}</h3>
          <div className="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
            <Field label={t("Niveau de priorité")}><select value={form.priority} onChange={set("priority")} className={inputCls} style={inputStyle}>{PRIORITIES.map(p=><option key={p} value={p}>{t(p)}</option>)}</select></Field>
            <Field label={t("Date limite de résolution")}><input type="date" value={form.deadline} onChange={set("deadline")} className={inputCls} style={inputStyle} /></Field>
            <Field label={t("Statut initial")}><input disabled value={t("Nouvelle")} className={inputCls} style={{ ...inputStyle, background: C.paperDim }} /></Field>
          </div>
        </section>
        <div className="flex items-center gap-3">
          <button onClick={submit} disabled={saving} className="flex items-center gap-2 rounded px-6 py-2.5 text-sm font-bold text-white disabled:opacity-60" style={{ background: C.brass }}>{saving && <Spinner />}Enregistrer la plainte</button>
          <button onClick={() => setView("dashboard")} className="text-sm font-semibold" style={{ color: C.inkSoft }}>{t("Annuler")}</button>
        </div>
      </div>
    </div>
  );
}

function GrievLinkApp() {
  const [lang, setLangState] = useState(LANG);
  LANG = lang;
  const setLang = (l) => { LANG = l; try { localStorage.setItem("gl_lang", l); } catch(e) {} setLangState(l); };
  const [session, setSession] = useState(null);
  const [view, setView] = useState("dashboard");
  const [grievances, setGrievances] = useState([]);
  const [loading, setLoading] = useState(false);
  const [loadError, setLoadError] = useState("");

  const loadGrievances = useCallback(async (token) => {
    setLoading(true); setLoadError("");
    try { setGrievances(await sbRest("grievances?select=*&order=created_at.asc", { token })); }
    catch (err) { setLoadError(err.message); }
    finally { setLoading(false); }
  }, []);

  useEffect(() => { if (session?.token) loadGrievances(session.token); }, [session, loadGrievances]);

  if (!session) return <LoginScreen onAuth={setSession} lang={lang} setLang={setLang} />;

  return (
    <div className="flex min-h-screen" style={{ background: C.paper, fontFamily: "ui-sans-serif, system-ui, sans-serif" }}>
      <Sidebar view={view} setView={setView} onLogout={() => setSession(null)} />
      <main className="flex-1 overflow-auto">
        <div className="flex items-center justify-between border-b px-4 py-2 sm:justify-end" style={{ borderColor: C.paperDim }}>
          <span className="text-base font-black sm:hidden" style={{ color: C.ink }}>⛰ GrievLink</span>
          <div className="flex items-center gap-3">
            <LangSwitch lang={lang} setLang={setLang} />
            <button onClick={() => setSession(null)} className="text-xs sm:hidden" style={{ color: C.inkSoft }}>↩ {t("Se déconnecter")}</button>
          </div>
        </div>
        <div className="flex gap-1 overflow-x-auto border-b px-2 py-1.5 sm:hidden" style={{ borderColor: C.paperDim }}>
          {[["dashboard","🏠","Tableau de bord"],["new","➕","Nouvelle plainte"],["list","📋","Toutes les plaintes"]].map(([k,e,l]) => (
            <button key={k} onClick={() => setView(k)} className="whitespace-nowrap rounded px-3 py-1.5 text-xs font-semibold" style={{ background: view === k ? C.brass : "transparent", color: view === k ? "#fff" : C.inkSoft }}>{e} {t(l)}</button>
          ))}
        </div>
        {loadError && <div className="m-6 rounded border px-4 py-3 text-sm font-semibold" style={{ borderColor: C.red, color: C.red, background: C.red + "0d" }}>{t("Impossible de charger les plaintes :")} {loadError}</div>}
        {loading && <div className="flex items-center gap-2 p-6 text-sm" style={{ color: C.inkSoft }}><Spinner /> {t("Chargement des dossiers…")}</div>}
        {!loading && view === "dashboard" && <Dashboard grievances={grievances} setView={setView} />}
        {!loading && view === "new" && <NewGrievanceForm token={session.token} setView={setView} onCreated={(row)=>setGrievances(prev=>[...prev,row])} />}
        {!loading && (view === "list" || view === "search") && <ListView grievances={grievances} setView={setView} />}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<GrievLinkApp />);
</script>
</body>
</html>
