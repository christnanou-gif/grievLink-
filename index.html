async function sbAuth(path, body) {
  const res = await fetch(`${SUPABASE_URL}/auth/v1/${path}`, {
    method: "POST",
    headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error_description || data.msg || data.message || "Erreur d'authentification");
  return data;
}

async function sbRest(path, { method = "GET", token, body } = {}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    method,
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${token}`,
      "Content-Type": "application/json",
      Prefer: "return=representation",
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ([]));
  if (!res.ok) throw new Error(data.message || data.hint || "Erreur base de données");
  return data;
}


function parseRecoveryParams() {
  const raw = window.location.hash.startsWith("#") ? window.location.hash.slice(1) : window.location.hash;
  const params = new URLSearchParams(raw);
  if (params.get("type") === "recovery" && params.get("access_token")) {
    return params.get("access_token");
  }
  return null;
}

async function sbSetPassword(token, password) {
  const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
    method: "PUT",
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
    body: JSON.stringify({ password }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error_description || data.msg || data.message || "Erreur");
  return data;
}

function useSupabaseStatus() {
  const [status, setStatus] = useState("checking"); // checking | ok | down
  useEffect(() => {
    let alive = true;
    fetch(`${SUPABASE_URL}/auth/v1/health`, { headers: { apikey: SUPABASE_KEY } })
      .then((r) => { if (alive) setStatus(r.ok || r.status < 500 ? "ok" : "down"); })
      .catch(() => { if (alive) setStatus("down"); });
    return () => { alive = false; };
  }, []);
  return status;
}

function SupabaseStatusPill({ status }) {
  const map = {
    checking: { c: C.inkSoft, bg: "#F1F3F6", dot: C.inkSoft, label: t("Vérification…") },
    ok: { c: "#167A47", bg: "#E7F6EE", dot: "#167A47", label: t("Supabase connecté") },
    down: { c: C.red, bg: "#FBEAED", dot: C.red, label: t("Connexion Supabase impossible") },
  };
  const s = map[status];
  return (
    <div className="flex items-center justify-center gap-2 rounded-full border px-4 py-2 text-xs font-semibold" style={{ background: s.bg, borderColor: s.c + "33", color: s.c }}>
      <span className="h-2 w-2 rounded-full" style={{ background: s.dot }} />{s.label}
    </div>
  );
}

  const [error, setError] = useState("");
  const [info, setInfo] = useState("");
  const sbStatus = useSupabaseStatus();

  const submit = async () => {
    setError(""); setInfo("");
    const cleanEmail = email.trim();
    if (!cleanEmail || !cleanEmail.includes("@")) { setError(t("Entrez une adresse e-mail valide.")); return; }
    if (password.length < 6) { setError(t("Le mot de passe doit contenir au moins 6 caractères.")); return; }
    try { localStorage.setItem("gl_site", site); } catch(e) {}
    setLoading(true);
    try {
      if (mode === "signup") {
        const data = await sbAuth("signup", { email, password, data: { site } });
        if (data.access_token) { onAuth({ token: data.access_token, user: data.user }); }
        else { setInfo(t("Compte créé. Vérifiez votre boîte mail si la confirmation est activée, sinon reconnectez-vous.")); setMode("signin"); }
      } else {
        const data = await sbAuth("token?grant_type=password", { email, password });
        onAuth({ token: data.access_token, user: data.user });
      }
    } catch (err) { setError(err.message); }
    finally { setLoading(false); }
  };

  const flagBtn = (code, flag, activeLang) => (
    <button onClick={() => setLang(code)}
      className="flex h-9 w-16 items-center justify-center gap-1 rounded-full border text-base transition"
      style={{ background: lang === code ? C.navy : "#fff", borderColor: lang === code ? C.navy : C.paperDim }}>

          <div className="mt-4 rounded-xl px-4 py-3" style={{ background: C.primaryLight }}>

            <span className="h-px flex-1" style={{ background: C.paperDim }} />
            <span className="h-2 w-2 rotate-45" style={{ background: C.amber }} />

function RecoveryScreen({ accessToken, onDone, lang, setLang }) {
  const [pw, setPw] = useState("");
  const [pw2, setPw2] = useState("");
  const [msg, setMsg] = useState(null);
  const [saving, setSaving] = useState(false);

  const submit = async () => {
    setMsg(null);
    if (pw.length < 6) { setMsg({ k: "err", m: t("Le mot de passe doit contenir au moins 6 caractères.") }); return; }
    if (pw !== pw2) { setMsg({ k: "err", m: t("Les mots de passe ne correspondent pas.") }); return; }
    setSaving(true);
    try {
      await sbSetPassword(accessToken, pw);
      setMsg({ k: "ok", m: t("Mot de passe modifié avec succès.") });
      setTimeout(() => { window.location.hash = ""; onDone(); }, 1500);
    } catch (e) { setMsg({ k: "err", m: e.message }); }
    finally { setSaving(false); }
  };

  return (
    <div className="relative flex min-h-screen items-center justify-center overflow-hidden px-6" style={{ background: "linear-gradient(160deg, #EAF1FF 0%, #F5F7FB 55%, #FFFFFF 100%)" }}>
      <div className="absolute right-4 top-4 z-20"><LangSwitch lang={lang} setLang={setLang} /></div>
      <div className="w-full max-w-sm overflow-hidden rounded-md border shadow-md" style={{ background: "#fff", borderColor: C.paperDim }}>
        <div className="h-1.5 w-full" style={{ background: C.navy }} />
        <div className="p-6">
          <h1 className="mb-1 text-lg font-bold" style={{ color: C.ink }}>{t("Changer le mot de passe")}</h1>
          <p className="mb-4 text-xs" style={{ color: C.inkSoft }}>GrievLink</p>
          {msg && <Notice kind={msg.k}>{msg.m}</Notice>}
          <div className="space-y-4">
            <Field label={t("Nouveau mot de passe")}><input type="password" value={pw} onChange={(e)=>setPw(e.target.value)} className={inputCls} style={inputStyle} /></Field>
            <Field label={t("Confirmer le mot de passe")}><input type="password" value={pw2} onChange={(e)=>setPw2(e.target.value)} className={inputCls} style={inputStyle} /></Field>
            <button onClick={submit} disabled={saving} className="flex w-full items-center justify-center gap-2 rounded-md py-2.5 text-sm font-bold text-white disabled:opacity-60" style={{ background: C.primary }}>
              {saving && <Spinner />}{t("Enregistrer")}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

function UsersView({ token, meId }) {
  const [users, setUsers] = useState([]);

  const [f, setF] = useState({ email: "", password: "", name: "", role: "agent", dept: "" });
  const [msg, setMsg] = useState(null);
  const [adding, setAdding] = useState(false);
  const load = useCallback(async () => {
    try { setUsers(await sbRest("profiles?select=*&order=created_at.asc", { token })); setError(""); }
    catch (e) { setError(e.message); } finally { setLoading(false); }
  }, [token]);
  useEffect(() => { load(); }, [load]);

  const add = async () => {
    setMsg(null);
    if (!f.email.includes("@")) { setMsg({ k: "err", m: t("Entrez une adresse e-mail valide.") }); return; }
    if (f.password.length < 6) { setMsg({ k: "err", m: t("Le mot de passe doit contenir au moins 6 caractères.") }); return; }
    setAdding(true);
    try {
      const data = await sbAuth("signup", { email: f.email.trim(), password: f.password, data: { full_name: f.name } });
      const id = data.user?.id || data.id;
      if (!id) throw new Error("Erreur");
      await sbRest(`profiles?id=eq.${id}`, { method: "PATCH", token, body: { full_name: f.name || null, role: f.role, department: f.dept || null, active: true } });
      setMsg({ k: "ok", m: t("Utilisateur créé.") });
      setF({ email: "", password: "", name: "", role: "agent", dept: "" });
      load();
    } catch (e) { setMsg({ k: "err", m: e.message }); }
    finally { setAdding(false); }
  };

  return (
    <div className="p-6 sm:p-8">
      <h2 className="text-2xl font-black tracking-tight" style={{ color: C.ink }}>{t("Gestion des utilisateurs")}</h2>

        {msg && <Notice kind={msg.k}>{msg.m}</Notice>}
        <div className="grid gap-3 sm:grid-cols-3">
          <Field label={t("E-mail")}><input value={f.email} onChange={(e)=>setF({ ...f, email: e.target.value })} className={inputCls} style={inputStyle} /></Field>
          <Field label={t("Mot de passe")}><input type="password" value={f.password} onChange={(e)=>setF({ ...f, password: e.target.value })} placeholder={t("6 caractères minimum")} className={inputCls} style={inputStyle} /></Field>
          <Field label={t("Nom complet")}><input value={f.name} onChange={(e)=>setF({ ...f, name: e.target.value })} className={inputCls} style={inputStyle} /></Field>
          <RoleFields role={f.role} setRole={(v)=>setF({ ...f, role: v })} dept={f.dept} setDept={(v)=>setF({ ...f, dept: v })} />

      {error && <Notice kind="err">{error}</Notice>}
      {loading ? <div className="flex items-center gap-2 text-sm" style={{ color: C.inkSoft }}><Spinner /> {t("Chargement…")}</div>
        : users.map(u => <UserRow key={u.id + String(u.active) + u.role} u={u} token={token} isSelf={u.id === meId} onSaved={load} />)}

function GrievanceDetail({ grievance, token, profile, users, setView, onUpdated }) {
  const [g, setG] = useState(grievance);
  const [actions, setActions] = useState([]);
  const [loadingActions, setLoadingActions] = useState(true);
  const [comment, setComment] = useState("");
  const [savingComment, setSavingComment] = useState(false);
  const [status, setStatus] = useState(grievance.status);
  const [savingStatus, setSavingStatus] = useState(false);
  const [assignee, setAssignee] = useState(grievance.assigned_to || "");
  const [savingAssign, setSavingAssign] = useState(false);
  const [escalating, setEscalating] = useState(false);
  const [fbText, setFbText] = useState(grievance.feedback_text || "");
  const [fbSat, setFbSat] = useState(grievance.feedback_satisfaction || "Satisfait");
  const [fbDate, setFbDate] = useState(grievance.feedback_date || new Date().toISOString().slice(0,10));
  const [savingFb, setSavingFb] = useState(false);
  const [err, setErr] = useState("");
  const canManage = profile.role === "admin" || profile.role === "manager";

  const loadActions = useCallback(async () => {
    setLoadingActions(true);
    try {
      const rows = await sbRest(`actions?select=*,author:author_id(full_name,email)&grievance_id=eq.${g.id}&order=created_at.asc`, { token });
      setActions(rows);
    } catch (e) { /* silencieux : le journal n'est pas critique */ }
    finally { setLoadingActions(false); }
  }, [g.id, token]);
  useEffect(() => { loadActions(); }, [loadActions]);

  const logAction = async (action_type, text) => {
    try { await sbRest("actions", { method: "POST", token, body: { grievance_id: g.id, action_type, comment: text || null } }); loadActions(); }
    catch (e) {}
  };

  const patchGrievance = async (body, type, text) => {
    const rows = await sbRest(`grievances?id=eq.${g.id}`, { method: "PATCH", token, body });
    const updated = rows[0];
    setG(updated); onUpdated(updated);
    if (type) logAction(type, text);
    return updated;
  };

  const addComment = async () => {
    if (!comment.trim()) return;
    setSavingComment(true); setErr("");
    try { await logAction("commentaire", comment.trim()); setComment(""); }
    catch (e) { setErr(e.message); }
    finally { setSavingComment(false); }
  };

  const updateStatus = async () => {
    if (status === g.status) return;
    setSavingStatus(true); setErr("");
    try { await patchGrievance({ status }, "changement de statut", `${t(g.status)} → ${t(status)}`); }
    catch (e) { setErr(e.message); }
    finally { setSavingStatus(false); }
  };

  const updateAssignee = async () => {
    setSavingAssign(true); setErr("");
    try {
      const u = users.find(u => u.id === assignee);
      await patchGrievance({ assigned_to: assignee || null }, "attribution", u ? (u.full_name || u.email) : t("Non assigné"));
    } catch (e) { setErr(e.message); }
    finally { setSavingAssign(false); }
  };

  const escalate = async () => {
    setEscalating(true); setErr("");
    try { await patchGrievance({ escalated: true, escalated_at: new Date().toISOString() }, "escalade", null); }
    catch (e) { setErr(e.message); }
    finally { setEscalating(false); }
  };

  const saveFeedback = async () => {
    setSavingFb(true); setErr("");
    try { await patchGrievance({ feedback_given: true, feedback_text: fbText, feedback_date: fbDate, feedback_satisfaction: fbSat }, "retour d'information", fbText.slice(0, 120)); }
    catch (e) { setErr(e.message); }
    finally { setSavingFb(false); }
  };

  const sectionCls = "rounded-md border shadow-sm p-5";
  const sectionStyle = { borderColor: C.paperDim, background: "#fff" };

  return (
    <div className="mx-auto max-w-3xl p-6 sm:p-8">
      <div className="mb-6 flex items-center gap-3">
        <button onClick={() => setView("list")} className="rounded p-1.5" style={{ color: C.inkSoft }}>‹</button>
        <div className="flex-1">
          <div className="flex flex-wrap items-center gap-2">
            <CaseTag id={g.case_number} />
            <StatusBadge status={g.status} />
            {g.escalated && <span className="rounded-full px-2.5 py-1 text-xs font-semibold" style={{ background: C.red + "1a", color: C.red }}>🚨 {t("Dossier escaladé")}</span>}
            {isOverdue(g) && <span className="rounded-full px-2.5 py-1 text-xs font-semibold" style={{ background: C.red + "1a", color: C.red }}>{t("En retard")}</span>}
          </div>
          <h2 className="mt-1 text-xl font-black tracking-tight" style={{ color: C.ink }}>{g.village || "—"} · {t(g.category)}</h2>
        </div>
      </div>

      {err && <Notice kind="err">{err}</Notice>}

      <div className="mb-5 grid gap-5 sm:grid-cols-2">
        <section className={sectionCls} style={sectionStyle}>
          <h3 className="mb-3 text-sm font-bold" style={{ color: C.primary }}>{t("Informations générales")}</h3>
          <dl className="space-y-1.5 text-sm">
            <div className="flex justify-between"><dt style={{ color: C.inkSoft }}>{t("Date de réception")}</dt><dd style={{ color: C.ink }}>{g.date_received}</dd></div>
            <div className="flex justify-between"><dt style={{ color: C.inkSoft }}>{t("Priorité")}</dt><dd style={{ color: C.ink }}>{t(g.priority)}</dd></div>
            <div className="flex justify-between"><dt style={{ color: C.inkSoft }}>{t("Canal de réception")}</dt><dd style={{ color: C.ink }}>{t(g.channel)}</dd></div>
            <div className="flex justify-between"><dt style={{ color: C.inkSoft }}>{t("Date limite")}</dt><dd style={{ color: isOverdue(g) ? C.red : C.ink }}>{g.deadline || t("Pas de délai fixé")}</dd></div>
          </dl>
          {g.description && <p className="mt-3 border-t pt-3 text-sm" style={{ borderColor: C.paperDim, color: C.ink }}>{g.description}</p>}
        </section>

        <section className={sectionCls} style={sectionStyle}>
          <h3 className="mb-3 text-sm font-bold" style={{ color: C.primary }}>{t("Plaignant")}</h3>
          {g.is_anonymous ? <p className="text-sm" style={{ color: C.inkSoft }}>{t("Anonyme")}</p> : (
            <dl className="space-y-1.5 text-sm">
              <div className="flex justify-between"><dt style={{ color: C.inkSoft }}>{t("Nom et prénom")}</dt><dd style={{ color: C.ink }}>{g.complainant_name || t("Non renseigné")}</dd></div>
              <div className="flex justify-between"><dt style={{ color: C.inkSoft }}>{t("Sexe")}</dt><dd style={{ color: C.ink }}>{g.complainant_gender ? t(g.complainant_gender) : "—"}</dd></div>
              <div className="flex justify-between"><dt style={{ color: C.inkSoft }}>{t("Contact")}</dt><dd style={{ color: C.ink }}>{g.complainant_contact || t("Non renseigné")}</dd></div>
            </dl>
          )}
        </section>
      </div>

      <div className="mb-5 grid gap-5 sm:grid-cols-2">
        <section className={sectionCls} style={sectionStyle}>
          <h3 className="mb-3 text-sm font-bold" style={{ color: C.primary }}>{t("Changer le statut")}</h3>
          <select value={status} onChange={(e)=>setStatus(e.target.value)} className={inputCls} style={inputStyle}>
            {STATUS_ORDER.map(s => <option key={s} value={s}>{t(s)}</option>)}
          </select>
          <button onClick={updateStatus} disabled={savingStatus || status === g.status} className="mt-3 flex items-center gap-2 rounded-md px-4 py-2 text-xs font-bold text-white disabled:opacity-50" style={{ background: C.primary }}>{savingStatus && <Spinner />}{t("Mettre à jour")}</button>
        </section>

        <section className={sectionCls} style={sectionStyle}>
          <h3 className="mb-3 text-sm font-bold" style={{ color: C.primary }}>{t("Attribution")}</h3>
          {canManage ? (
            <>
              <select value={assignee} onChange={(e)=>setAssignee(e.target.value)} className={inputCls} style={inputStyle}>
                <option value="">{t("Non assigné")}</option>
                {users.map(u => <option key={u.id} value={u.id}>{u.full_name || u.email}</option>)}
              </select>
              <button onClick={updateAssignee} disabled={savingAssign} className="mt-3 flex items-center gap-2 rounded-md px-4 py-2 text-xs font-bold text-white disabled:opacity-50" style={{ background: C.primary }}>{savingAssign && <Spinner />}{t("Attribuer")}</button>
            </>
          ) : (
            <p className="text-sm" style={{ color: C.ink }}>{(users.find(u => u.id === g.assigned_to) || {}).full_name || (users.find(u => u.id === g.assigned_to) || {}).email || t("Non assigné")}</p>
          )}
          {canManage && !g.escalated && (
            <button onClick={escalate} disabled={escalating} className="mt-3 flex items-center gap-2 rounded-md border px-4 py-2 text-xs font-bold disabled:opacity-50" style={{ borderColor: C.red, color: C.red }}>{escalating && <Spinner />}🚨 {t("Signaler une escalade")}</button>
          )}
          {g.escalated && <p className="mt-3 text-xs font-semibold" style={{ color: C.red }}>{t("Escaladé le")} {new Date(g.escalated_at).toLocaleDateString()}</p>}
        </section>
      </div>

      <section className={sectionCls + " mb-5"} style={sectionStyle}>
        <h3 className="mb-3 text-sm font-bold" style={{ color: C.primary }}>{t("Retour d'information au plaignant")}</h3>
        {g.feedback_given && <p className="mb-3 text-xs font-semibold" style={{ color: C.green }}>✓ {t("Retour enregistré le")} {g.feedback_date}</p>}
        <div className="grid gap-3 sm:grid-cols-2">
          <Field label={t("Satisfaction du plaignant")}>
            <select value={fbSat} onChange={(e)=>setFbSat(e.target.value)} className={inputCls} style={inputStyle}>
              <option value="Satisfait">{t("Satisfait")}</option>
              <option value="Neutre">{t("Neutre")}</option>
              <option value="Insatisfait">{t("Insatisfait")}</option>
            </select>
          </Field>
          <Field label={t("Date du retour")}><input type="date" value={fbDate} onChange={(e)=>setFbDate(e.target.value)} className={inputCls} style={inputStyle} /></Field>
        </div>
        <div className="mt-3">
          <Field label={t("Contenu du retour donné")}><textarea rows={3} value={fbText} onChange={(e)=>setFbText(e.target.value)} className={inputCls} style={inputStyle} /></Field>
        </div>
        <button onClick={saveFeedback} disabled={savingFb} className="mt-3 flex items-center gap-2 rounded-md px-4 py-2 text-xs font-bold text-white disabled:opacity-50" style={{ background: C.primary }}>{savingFb && <Spinner />}{t("Enregistrer le retour")}</button>
      </section>

      <section className={sectionCls} style={sectionStyle}>
        <h3 className="mb-3 text-sm font-bold" style={{ color: C.primary }}>{t("Journal des actions")}</h3>
        <div className="mb-3 flex gap-2">
          <input value={comment} onChange={(e)=>setComment(e.target.value)} placeholder={t("Écrire un commentaire ou une mise à jour…")} className={inputCls} style={inputStyle} />
          <button onClick={addComment} disabled={savingComment} className="shrink-0 rounded-md px-4 py-2 text-xs font-bold text-white disabled:opacity-50" style={{ background: C.primary }}>{t("Ajouter")}</button>
        </div>
        {loadingActions ? <div className="flex items-center gap-2 text-sm" style={{ color: C.inkSoft }}><Spinner /> {t("Chargement du journal…")}</div>
          : actions.length === 0 ? <p className="text-sm" style={{ color: C.inkSoft }}>{t("Aucune action enregistrée pour l'instant.")}</p>
          : actions.map(a => <ActionRow key={a.id} a={a} />)}
      </section>
    </div>
  );
}

function Field({ label, children, required }) {
  return (
    <label className="block">
      <span className="mb-1 block text-xs font-semibold uppercase tracking-wide" style={{ color: C.inkSoft }}>{label}{required && <span style={{ color: C.red }}> *</span>}</span>
      {children}
    </label>
  );
}
const inputCls = "w-full rounded-md border px-3 py-2 text-sm outline-none";
const inputStyle = { borderColor: C.paperDim, color: C.ink };

function NewGrievanceForm({ token, onCreated, setView }) {
  const [form, setForm] = useState({
    date: new Date().toISOString().slice(0,10), village: "", lat: "", lng: "",
    anonymous: false, name: "", gender: "Femme", contact: "",
    channel: CHANNELS[0], category: CATEGORIES[0], description: "", priority: "Moyen", deadline: "",
  });
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState("");
  const set = (k) => (e) => setForm(f => ({ ...f, [k]: e.target?.value ?? e }));
  const sensitive = form.category === "VBG / EAS-HS" || form.category === "Protection de l'enfant";

  const submit = async () => {
    setError("");
    if (!form.village.trim()) { setError(t("Le champ Village / Communauté est requis.")); return; }
    if (!form.description.trim()) { setError(t("Le champ Description est requis.")); return; }
    setSaving(true);
    try {
      const payload = {
        date_received: form.date, village: form.village || null, channel: form.channel,
        is_anonymous: form.anonymous,
        complainant_name: form.anonymous ? null : (form.name || null),
        complainant_gender: form.anonymous ? null : form.gender,
        complainant_contact: form.anonymous ? null : (form.contact || null),
        category: form.category, description: form.description, priority: form.priority,
        deadline: form.deadline || null,
        latitude: form.lat ? Number(form.lat) : null, longitude: form.lng ? Number(form.lng) : null,
      };
      const rows = await sbRest("grievances", { method: "POST", token, body: payload });
      onCreated(rows[0]);
      setView("dashboard");
    } catch (err) { setError(err.message); }
    finally { setSaving(false); }
  };

  return (
    <div className="p-6 sm:p-8">
      <div className="mb-6 flex items-center gap-3">
        <button onClick={() => setView("dashboard")} className="rounded p-1.5" style={{ color: C.inkSoft }}>‹</button>
        <div>
          <h2 className="text-2xl font-black tracking-tight" style={{ color: C.ink }}>{t("Nouvelle plainte")}</h2>
          <p className="text-sm" style={{ color: C.inkSoft }}>{t("Le numéro de dossier (GL-2026-…) est généré automatiquement à l'enregistrement")}</p>
        </div>
      </div>
      {sensitive && <div className="mb-5 flex items-center gap-2 rounded border px-4 py-3 text-sm font-semibold" style={{ borderColor: C.red, color: C.red, background: C.red + "0d" }}>⚠️ {t("Dossier sensible — accès restreint, confidentialité renforcée")}</div>}
      {error && <div className="mb-5 rounded border px-4 py-3 text-sm font-semibold" style={{ borderColor: C.red, color: C.red, background: C.red + "0d" }}>{error}</div>}
      <div className="space-y-8">
        <section className="rounded-md border shadow-sm p-5" style={{ borderColor: C.paperDim, background: "#fff" }}>
          <h3 className="mb-4 text-sm font-bold" style={{ color: C.primary }}>{t("1. Informations générales")}</h3>
          <div className="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
            <Field label={t("Date de réception")} required><input type="date" value={form.date} onChange={set("date")} className={inputCls} style={inputStyle} /></Field>
            <Field label={t("Village / Communauté")} required><input value={form.village} onChange={set("village")} placeholder={t("Ex : Kanzenze")} className={inputCls} style={inputStyle} /></Field>
            <Field label={t("Canal de réception")}><select value={form.channel} onChange={set("channel")} className={inputCls} style={inputStyle}>{CHANNELS.map(c=><option key={c} value={c}>{t(c)}</option>)}</select></Field>
            <Field label={t("Latitude (optionnel)")}><input value={form.lat} onChange={set("lat")} placeholder="-10.71" className={inputCls} style={inputStyle} /></Field>
            <Field label={t("Longitude (optionnel)")}><input value={form.lng} onChange={set("lng")} placeholder="25.47" className={inputCls} style={inputStyle} /></Field>
          </div>
        </section>
        <section className="rounded-md border shadow-sm p-5" style={{ borderColor: C.paperDim, background: "#fff" }}>
          <h3 className="mb-4 text-sm font-bold" style={{ color: C.primary }}>{t("2. Plaignant")}</h3>
          <label className="mb-4 flex items-center gap-2 text-sm" style={{ color: C.ink }}>
            <input type="checkbox" checked={form.anonymous} onChange={(e)=>set("anonymous")(e.target.checked)} /> {t("Plainte anonyme")}
          </label>
          {!form.anonymous && (
            <div className="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
              <Field label={t("Nom et prénom")}><input value={form.name} onChange={set("name")} className={inputCls} style={inputStyle} /></Field>
              <Field label={t("Sexe")}><select value={form.gender} onChange={set("gender")} className={inputCls} style={inputStyle}><option value="Femme">{t("Femme")}</option><option value="Homme">{t("Homme")}</option><option value="Autre">{t("Autre")}</option></select></Field>
              <Field label={t("Contact")}><input value={form.contact} onChange={set("contact")} placeholder="+243 …" className={inputCls} style={inputStyle} /></Field>
            </div>
          )}
        </section>
        <section className="rounded-md border shadow-sm p-5" style={{ borderColor: C.paperDim, background: "#fff" }}>
          <h3 className="mb-4 text-sm font-bold" style={{ color: C.primary }}>{t("3. Détails de la plainte")}</h3>
          <div className="mb-4 grid gap-4 sm:grid-cols-2">
            <Field label={t("Catégorie")} required><select value={form.category} onChange={set("category")} className={inputCls} style={inputStyle}>{CATEGORIES.map(c=><option key={c} value={c}>{t(c)}</option>)}</select></Field>
            <Field label={t("Pièces jointes")}><div className="flex items-center gap-2 rounded border px-3 py-2 text-sm" style={{ borderColor: C.paperDim, color: C.inkSoft }}>📎 {t("Photo, audio ou document (v2)")}</div></Field>
          </div>
          <Field label={t("Description")} required><textarea rows={4} value={form.description} onChange={set("description")} placeholder={t("Décrire les faits, personnes concernées, contexte…")} className={inputCls} style={inputStyle} /></Field>
        </section>
        <section className="rounded-md border shadow-sm p-5" style={{ borderColor: C.paperDim, background: "#fff" }}>
          <h3 className="mb-4 text-sm font-bold" style={{ color: C.primary }}>{t("4. Classification & traitement")}</h3>
          <div className="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
            <Field label={t("Niveau de priorité")}><select value={form.priority} onChange={set("priority")} className={inputCls} style={inputStyle}>{PRIORITIES.map(p=><option key={p} value={p}>{t(p)}</option>)}</select></Field>
            <Field label={t("Date limite de résolution")}><input type="date" value={form.deadline} onChange={set("deadline")} className={inputCls} style={inputStyle} /></Field>
            <Field label={t("Statut initial")}><input disabled value={t("Nouvelle")} className={inputCls} style={{ ...inputStyle, background: C.paperDim }} /></Field>
          </div>
        </section>
        <div className="flex items-center gap-3">
          <button onClick={submit} disabled={saving} className="flex items-center gap-2 rounded px-6 py-2.5 text-sm font-bold text-white disabled:opacity-60" style={{ background: C.primary }}>{saving && <Spinner />}Enregistrer la plainte</button>
          <button onClick={() => setView("dashboard")} className="text-sm font-semibold" style={{ color: C.inkSoft }}>{t("Annuler")}</button>
        </div>
      </div>
    </div>
  );
}

function GrievLinkApp() {
  const [lang, setLangState] = useState(LANG);
  LANG = lang;
  const setLang = (l) => { LANG = l; try { localStorage.setItem("gl_lang", l); } catch(e) {} setLangState(l); };
  const [recoveryToken, setRecoveryToken] = useState(() => parseRecoveryParams());
  const [session, setSession] = useState(null);
  const [profile, setProfile] = useState(null);
  const [pState, setPState] = useState("idle");
  const [view, setView] = useState("dashboard");
  const [grievances, setGrievances] = useState([]);
  const [loading, setLoading] = useState(false);
  const [loadError, setLoadError] = useState("");
  const [selected, setSelected] = useState(null);
  const [users, setUsers] = useState([]);

  const logout = () => { setSession(null); setProfile(null); setPState("idle"); setGrievances([]); setSelected(null); setView("dashboard"); };

  const openGrievance = (g) => { setSelected(g); setView("detail"); };
  const onGrievanceUpdated = (row) => {
    setGrievances(prev => prev.map(x => x.id === row.id ? row : x));
    setSelected(row);
  };

  const loadProfile = useCallback(async (sess) => {
    setPState("loading");
    try {
      const rows = await sbRest(`profiles?select=*&id=eq.${sess.user.id}`, { token: sess.token });
      if (rows[0]) { setProfile(rows[0]); setPState("ready"); } else setPState("missing");
    } catch (e) { setPState("missing"); }
  }, []);

  const loadGrievances = useCallback(async (token) => {
    setLoading(true); setLoadError("");
    try { setGrievances(await sbRest("grievances?select=*&order=created_at.asc", { token })); }
    catch (err) { setLoadError(err.message); }
    finally { setLoading(false); }
  }, []);

  const loadUsers = useCallback(async (token) => {
    try { setUsers(await sbRest("profiles?select=id,full_name,email,role&active=eq.true", { token })); }
    catch (e) {}
  }, []);

  useEffect(() => { if (session) loadProfile(session); }, [session, loadProfile]);
  useEffect(() => { if (session?.token && profile?.active) { loadGrievances(session.token); loadUsers(session.token); } }, [session, profile, loadGrievances, loadUsers]);

  if (recoveryToken) return <RecoveryScreen accessToken={recoveryToken} onDone={() => setRecoveryToken(null)} lang={lang} setLang={setLang} />;
  if (!session) return <LoginScreen onAuth={setSession} lang={lang} setLang={setLang} />;
  if (pState === "idle" || pState === "loading")
    return <div className="flex min-h-screen items-center justify-center gap-2 text-sm" style={{ background: C.paper, color: C.inkSoft }}><Spinner /> {t("Chargement…")}</div>;
  if (pState === "missing")
    return <StatusScreen title={t("Profil")} text={t("Profil introuvable. Le script SQL du lot 1 doit être exécuté dans Supabase.")} lang={lang} setLang={setLang} onLogout={logout} onReload={() => loadProfile(session)} />;
  if (!profile.active)
    return <StatusScreen title={t("Compte en attente d'activation")} text={t("Votre compte a été créé. Un administrateur doit l'activer avant que vous puissiez accéder à la plateforme.")} lang={lang} setLang={setLang} onLogout={logout} onReload={() => loadProfile(session)} />;

  const allowed = navItems(profile.role).filter(i => i.active);
  const current = (view === "detail" || allowed.some(i => i.key === view)) ? view : "dashboard";

  return (
    <div className="flex min-h-screen" style={{ background: C.paper, fontFamily: "ui-sans-serif, system-ui, sans-serif" }}>
      <Sidebar view={current} setView={setView} onLogout={logout} profile={profile} />
      <main className="flex-1 overflow-auto">
        <div className="flex items-center justify-between border-b px-4 py-2 sm:justify-end" style={{ borderColor: C.paperDim }}>
          <span className="text-base font-extrabold tracking-wide sm:hidden" style={{ color: C.navy, fontFamily: "'Playfair Display', serif", fontVariant: "small-caps" }}>⛏ GrievLink</span>
          <div className="flex items-center gap-3">
            <LangSwitch lang={lang} setLang={setLang} />
            <button onClick={logout} className="text-xs sm:hidden" style={{ color: C.inkSoft }}>↩ {t("Se déconnecter")}</button>
          </div>
        </div>
        <div className="flex gap-1 overflow-x-auto border-b px-2 py-1.5 sm:hidden" style={{ borderColor: C.paperDim }}>
          {allowed.filter(i => i.key !== "search").map(i => (
            <button key={i.key} onClick={() => setView(i.key)} className="whitespace-nowrap rounded px-3 py-1.5 text-xs font-semibold" style={{ background: current === i.key ? C.primary : "transparent", color: current === i.key ? "#fff" : C.inkSoft }}>{i.emoji} {i.label}</button>
          ))}
        </div>
        {loadError && <div className="m-6 rounded border px-4 py-3 text-sm font-semibold" style={{ borderColor: C.red, color: C.red, background: C.red + "0d" }}>{t("Impossible de charger les plaintes :")} {loadError}</div>}
        {loading && <div className="flex items-center gap-2 p-6 text-sm" style={{ color: C.inkSoft }}><Spinner /> {t("Chargement des dossiers…")}</div>}
        {!loading && current === "dashboard" && <Dashboard grievances={grievances} setView={setView} onOpen={openGrievance} />}
        {!loading && current === "new" && <NewGrievanceForm token={session.token} setView={setView} onCreated={(row)=>setGrievances(prev=>[...prev,row])} />}
        {!loading && (current === "list" || current === "search") && <ListView grievances={grievances} setView={setView} onOpen={openGrievance} />}
        {current === "detail" && selected && <GrievanceDetail grievance={selected} token={session.token} profile={profile} users={users} setView={setView} onUpdated={onGrievanceUpdated} />}
        {current === "account" && <AccountView session={session} profile={profile} />}
        {current === "users" && <UsersView token={session.token} meId={session.user.id} />}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<GrievLinkApp />);
</script>
</body>
</html>
